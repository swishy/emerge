			name = "Prepare Frameworks (combined ERTS + emerge_skia)";
			outputFileListPaths = (
			);
			outputPaths = (
				"$(SRCROOT)/Frameworks/liberlang_combined.a",
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "set -e\nEMERGE_DIR=\"..\"\nCACHE_DIR=\"$HOME/.cache/emerge/ios\"\nmkdir -p \"$SRCROOT/Frameworks\"\n\n# Resolve EMERGE_DIR relative to SRCROOT\nif [ \"${EMERGE_DIR:0:1}\" != \"/\" ] && [ \"${EMERGE_DIR:0:1}\" != \"~\" ]; then\n  EMERGE_DIR=\"$SRCROOT/$EMERGE_DIR\"\nfi\n\n# --- liberlang_combined.a ---\nAPP_ROOT=\"$SRCROOT/../..\"\nAPP_BUILD_OUTPUT=\"$APP_ROOT/_build/ios_otp_output\"\nEMERGE_BUILD_OUTPUT=\"$EMERGE_DIR/_build/ios_otp_output\"\nOTP_SRC=\"$APP_ROOT/_build/ios_otp/otp_src\"\nTARGET=\"aarch64-apple-darwin\"\nVARIANT=\"opt\"\n\n# Prefer app's build output, fall back to emerge repo\nif [ -d \"$APP_BUILD_OUTPUT\" ]; then\n  BUILD_OUTPUT=\"$APP_BUILD_OUTPUT\"\nelse\n  BUILD_OUTPUT=\"$EMERGE_BUILD_OUTPUT\"\nfi\n\nif [ -f \"$CACHE_DIR/liberlang_combined.a\" ]; then\n  echo \"Using cached liberlang_combined.a\"\n  cp \"$CACHE_DIR/liberlang_combined.a\" \"$SRCROOT/Frameworks/liberlang_combined.a\"\nelif [ -f \"$CACHE_DIR/liberlang.a\" ]; then\n  echo \"Using cached liberlang.a (renamed to liberlang_combined.a)\"\n  cp \"$CACHE_DIR/liberlang.a\" \"$SRCROOT/Frameworks/liberlang_combined.a\"\nelif [ -d \"$OTP_SRC\" ]; then\n  # Merge ERTS-dependent static libs into one archive\n  LIBS=()\n  for lib in \\\n    \"$BUILD_OUTPUT/liberlang.xcframework/ios-arm64/libbeam.a\" \\\n    \"$OTP_SRC/erts/lib/internal/$TARGET/liberts_internal_r.a\" \\\n    \"$OTP_SRC/erts/lib/internal/$TARGET/libethread.a\" \\\n    \"$OTP_SRC/erts/emulator/pcre/obj/$TARGET/$VARIANT/libepcre.a\" \\\n    \"$OTP_SRC/erts/emulator/zstd/obj/$TARGET/$VARIANT/libzstd.a\" \\\n    \"$OTP_SRC/erts/emulator/openssl/obj/$TARGET/$VARIANT/micro-openssl.a\" \\\n    \"$OTP_SRC/erts/emulator/ryu/obj/$TARGET/$VARIANT/libryu.a\" \\\n     \"$OTP_SRC/lib/asn1/priv/lib/aarch64-apple-ios/asn1rt_nif.a\" \\\n     \"$BUILD_OUTPUT\"/otp_release/erts-*/lib/libemerge_skia.a; do\n    if [ -f \"$lib\" ]; then\n      LIBS+=(\"$lib\")\n    fi\n  done\n  if [ ${#LIBS[@]} -gt 0 ]; then\n    echo \"Merging ${#LIBS[@]} ERTS archives into liberlang_combined.a\"\n    libtool -static -o \"$SRCROOT/Frameworks/liberlang_combined.a\" \"${LIBS[@]}\"\n  else\n    echo \"error: no ERTS library files found to merge\"\n    exit 1\n  fi\nelse\n  echo \"error: no OTP build artifacts or cache found — run 'mix ios.setup' first\"\n  exit 1\nfi\n\n# --- OTP release (erlang/) ---\nOTP_DST=\"$SRCROOT/Emerge/erlang\"\n# Check for flat release layout (otp_release/ with erts at top level)\n# as well as nested layout (otp_release/usr/local/lib/erlang/)\nif [ -d \"$CACHE_DIR/otp_release/erts-\"* ]; then\n  echo \"Using cached OTP release (flat layout)\"\n  OTP_SRC=\"$CACHE_DIR/otp_release\"\nelif [ -d \"$CACHE_DIR/otp_release/usr/local/lib/erlang\" ]; then\n  echo \"Using cached OTP release (nested layout)\"\n  OTP_SRC=\"$CACHE_DIR/otp_release/usr/local/lib/erlang\"\nelif [ -d \"$APP_BUILD_OUTPUT/otp_release/erts-\"* ]; then\n  echo \"Using app OTP release (flat layout)\"\n  OTP_SRC=\"$APP_BUILD_OUTPUT/otp_release\"\nelif [ -d \"$APP_BUILD_OUTPUT/otp_release/usr/local/lib/erlang\" ]; then\n  echo \"Using app OTP release (nested layout)\"\n  OTP_SRC=\"$APP_BUILD_OUTPUT/otp_release/usr/local/lib/erlang\"\nelif [ -d \"$EMERGE_BUILD_OUTPUT/otp_release/erts-\"* ]; then\n  echo \"Using emerge OTP release (flat layout)\"\n  OTP_SRC=\"$EMERGE_BUILD_OUTPUT/otp_release\"\nelif [ -d \"$EMERGE_BUILD_OUTPUT/otp_release/usr/local/lib/erlang\" ]; then\n  echo \"Using emerge OTP release (nested layout)\"\n  OTP_SRC=\"$EMERGE_BUILD_OUTPUT/otp_release/usr/local/lib/erlang\"\nelse\n  echo \"warning: OTP release not found — app may not boot without erlang/ directory\"\n  OTP_SRC=\"\"\nfi\nif [ -n \"$OTP_SRC\" ]; then\n  mkdir -p \"$OTP_DST\"\n  # Copy OTP release files without deleting existing app beams\n  for d in releases bin erts-*; do\n    if [ -d \"$OTP_SRC/$d\" ]; then\n      cp -r \"$OTP_SRC/$d\" \"$OTP_DST/\"\n    fi\n  done\n  # Copy OTP lib apps (skip ebin if already present to preserve app beams)\n  if [ -d \"$OTP_SRC/lib\" ]; then\n    mkdir -p \"$OTP_DST/lib\"\n    for appdir in \"$OTP_SRC/lib/\"*/; do\n      appname=$(basename \"$appdir\")\n      if [ ! -d \"$OTP_DST/lib/$appname\" ]; then\n        cp -r \"$appdir\" \"$OTP_DST/lib/\"\n      else\n        # App exists - copy priv/ and other non-ebin dirs\n        for subdir in \"$appdir\"*/; do\n          subname=$(basename \"$subdir\")\n          if [ \"$subname\" != \"ebin\" ] && [ ! -d \"$OTP_DST/lib/$appname/$subname\" ]; then\n            cp -r \"$subdir\" \"$OTP_DST/lib/$appname/\"\n          fi\n        done\n      fi\n    done\n    # Remove any .so/.dylib files — iOS uses static linking for NIFs.\n    # Host-platform shared libraries will crash on iOS.\n    find \"$OTP_DST/lib\" -type f \\( -name \"*.so\" -o -name \"*.dylib\" \\) -delete 2>/dev/null || true\n  fi\nfi\n";
		};
