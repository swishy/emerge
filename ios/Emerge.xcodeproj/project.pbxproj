			shellScript = "ERLANG_SRC=\"$SRCROOT/Emerge/erlang\"\nERLANG_DST=\"$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH/erlang\"\nif [ -d \"$ERLANG_SRC\" ]; then\n  rm -rf \"$ERLANG_DST\"\n  mkdir -p \"$ERLANG_DST\"\n  cp -r \"$ERLANG_SRC/releases\" \"$ERLANG_DST/\"\n  cp -r \"$ERLANG_SRC/bin\" \"$ERLANG_DST/\"\n  for d in \"$ERLANG_SRC\"/erts-*; do\n    cp -r \"$d\" \"$ERLANG_DST/\"\n  done\n  mkdir -p \"$ERLANG_DST/lib\"\n  for appdir in \"$ERLANG_SRC/lib/\"*/; do\n    if [ -d \"$appdir/ebin\" ]; then\n      mkdir -p \"$ERLANG_DST/lib/$(basename \"$appdir\")/ebin\"\n      cp \"$appdir\"/ebin/*.{beam,app} \"$ERLANG_DST/lib/$(basename \"$appdir\")/ebin/\" 2>/dev/null || true\n    fi\n    # Copy priv/ directory for NIF libraries, but exclude .so/.dylib files.\n    # iOS uses static linking — host shared libraries will crash.\n    if [ -d \"$appdir/priv\" ]; then\n      mkdir -p \"$ERLANG_DST/lib/$(basename \"$appdir\")/priv\"\n      # Copy priv/ contents but exclude native shared libraries\n      (cd \"$appdir/priv\" && find . -type f ! -name \"*.so\" ! -name \"*.dylib\" -exec cp --parents {} \"$ERLANG_DST/lib/$(basename \"$appdir\")/priv/\" \\;) 2>/dev/null || true\n      # Also copy any subdirectories (like priv/ssl/certs/)\n      (cd \"$appdir/priv\" && find . -type d ! -name \".\" -exec mkdir -p \"$ERLANG_DST/lib/$(basename \"$appdir\")/priv/{}\" \\;) 2>/dev/null || true\n    fi\n  done\nfi\n";
